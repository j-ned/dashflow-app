name: CI

on:
  push:
    branches: [master]
    paths-ignore: &non-source-paths
      - '**.md'
      - 'apps/web/specs/**'
      - '**/.claude/**'
      - 'apps/web/.superpowers/**'
      - 'apps/api/docs/**'
  pull_request:
    branches: [master]
    paths-ignore: *non-source-paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Un seul lockfile pour tout le workspace : l'audit couvre les deux apps d'un coup.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Version pnpm lue depuis "packageManager" (package.json racine) : une seule source de vérité.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Sans `cache: pnpm` : ce job n'installe rien, le cache n'aurait aucun dossier à sauver
      # (et son étape de fin ferait échouer le job).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - run: pnpm audit --prod --audit-level=high

  web:
    name: Web — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/web
      - name: Lint
        run: pnpm --filter @dashflow/web lint
      - name: Format check
        run: pnpm --filter @dashflow/web format:check
      - name: Test
        run: pnpm --filter @dashflow/web test

  api:
    name: API — Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/api
      - name: Lint
        run: pnpm --filter @dashflow/api lint:check # eslint sans --fix (échoue s'il reste une erreur)
      - name: Build
        run: pnpm --filter @dashflow/api build # tsc (typecheck complet)
      - name: Test
        run: pnpm --filter @dashflow/api test # vitest run (unit + module, dont les tests HTTP multipart)

  api-e2e:
    name: API — Integration & E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Throttling partagé (Vercel) : Redis + émulateur de l'API REST d'Upstash.
      redis:
        image: redis:7-alpine
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-redis-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dashflow_test
      JWT_SECRET: ci-e2e-test-secret-at-least-32-characters-long
      NODE_ENV: test
      RATE_LIMIT_REDIS_URL: http://localhost:8079
      RATE_LIMIT_REDIS_TOKEN: ci-redis-token
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/api
      - name: Migrate DB
        run: pnpm --filter @dashflow/api db:migrate # applique les migrations drizzle sur la base éphémère
      - name: Integration tests
        run: pnpm --filter @dashflow/api test:integration # filet anti-régression migration (schema-integrity, ...)
      - name: E2E tests
        run: pnpm --filter @dashflow/api test:e2e # boîte noire : l'API tourne dans son propre processus

  docker:
    name: Docker Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [web, api]
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      # Contexte = racine du monorepo (lockfile et pnpm-workspace.yaml y vivent).
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          tags: dashflow-${{ matrix.app }}:${{ github.sha }}
