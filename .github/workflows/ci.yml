name: CI

on:
  push:
    branches: [master]
    paths-ignore: &non-source-paths
      - '**.md'
      - 'apps/web/specs/**'
      - '**/.claude/**'
      - 'apps/web/.superpowers/**'
      - 'apps/api/docs/**'
  pull_request:
    branches: [master]
    paths-ignore: *non-source-paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Un seul lockfile pour tout le workspace : l'audit couvre les deux apps d'un coup.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Version pnpm lue depuis "packageManager" (package.json racine) : une seule source de vérité.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # Sans `cache: pnpm` : ce job n'installe rien, le cache n'aurait aucun dossier à sauver
      # (et son étape de fin ferait échouer le job).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - run: pnpm audit --prod --audit-level=high

  web:
    name: Web — Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/web
      - name: Lint
        run: pnpm --filter @dashflow/web lint
      - name: Format check
        run: pnpm --filter @dashflow/web format:check
      - name: Test
        run: pnpm --filter @dashflow/web test

  api:
    name: API — Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/api
      - name: Lint
        run: pnpm --filter @dashflow/api lint:check # eslint sans --fix (échoue s'il reste une erreur)
      # Le build (tsconfig.build.json) exclut les tests : sans cette étape, une spec qui ne compile
      # plus passe inaperçue, vitest ne vérifiant pas les types.
      - name: Typecheck (tests compris)
        run: pnpm --filter @dashflow/api typecheck
      - name: Build
        run: pnpm --filter @dashflow/api build # tsc du code de production
      - name: Test
        run: pnpm --filter @dashflow/api test # vitest run (unit + module, dont les tests HTTP multipart)

  api-e2e:
    name: API — Integration & E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Throttling partagé entre instances : un vrai Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dashflow_test
      JWT_SECRET: ci-e2e-test-secret-at-least-32-characters-long
      NODE_ENV: test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dashflow/api
      - name: Migrate DB
        run: pnpm --filter @dashflow/api db:migrate # applique les migrations drizzle sur la base éphémère
      - name: Integration tests
        run: pnpm --filter @dashflow/api test:integration # filet anti-régression migration (schema-integrity, ...)
      - name: E2E tests
        run: pnpm --filter @dashflow/api test:e2e # boîte noire : l'API tourne dans son propre processus

  # Images de production : construites sur chaque PR (un Dockerfile cassé se voit avant la fusion),
  # publiées sur GHCR seulement depuis master. Dokploy tire ces images (deploy/compose.yaml).
  docker:
    name: Docker Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [web, api]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dashflow-${{ matrix.app }}
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Connexion à GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Contexte = racine du monorepo (lockfile et pnpm-workspace.yaml y vivent).
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          # Commit déployé : release Sentry du front et de l'API (cf. les Dockerfile).
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          # Jeton Sentry, pour envoyer les source maps du front : seulement à la publication depuis
          # master (secret BuildKit, absent de l'image et des journaux). Sans lui, rien n'est envoyé.
          secrets: |
            sentry_auth_token=${{ env.PUBLISH == 'true' && matrix.app == 'web' && secrets.SENTRY_AUTH_TOKEN || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Image de sauvegarde : jugée de bout en bout (sauvegarde chiffrée puis restauration identique,
  # devant un Postgres et un stockage S3 jetables) avant d'être publiée.
  backup-image:
    name: Docker Build (backup)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dashflow-backup
      PUBLISH: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t "$IMAGE:sha-$GITHUB_SHA" -t "$IMAGE:latest" deploy/backup
      - name: Vérification de l'image de sauvegarde
        run: deploy/backup/check.sh "$IMAGE:sha-$GITHUB_SHA"
      - name: Publication sur GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"

  # Dokploy lit deploy/compose.yaml dans le dépôt à chaque déploiement : un fichier invalide ne doit
  # pas atteindre master. Le déclencheur est jugé devant un faux Dokploy : une redirection ou un
  # refus doivent échouer, jamais passer pour un déploiement.
  deploy-checks:
    name: Déploiement — compose et déclencheur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Vérification du compose
        run: .github/scripts/compose.check.sh
      - name: Vérification du déclencheur Dokploy
        run: .github/scripts/trigger-deploy.check.sh
      # Le jeton n'est utilisé qu'à la publication : un jeton expiré, révoqué ou sans accès à
      # l'organisation se voit ici, dès la PR, plutôt qu'au premier déploiement.
      - name: Jeton Sentry valide
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::Secret SENTRY_AUTH_TOKEN absent : les source maps ne seront pas envoyées à Sentry"
            exit 0
          fi
          npx --yes @sentry/cli@3.8.2 releases list --org j-ned --project dashflow-app-angular >/dev/null
          echo "Jeton Sentry valide : accès au projet dashflow-app-angular confirmé."

  # API Dokploy (`compose.deploy`) : la pile tire les images qui viennent d'être publiées. Sans les
  # secrets, les images sont publiées et le déploiement reste manuel. Le panneau étant derrière
  # Cloudflare Access, le jeton de service passe par CF_ACCESS_*.
  deploy:
    name: Déploiement Dokploy
    runs-on: ubuntu-latest
    needs: [docker, backup-image, deploy-checks, api-e2e, audit]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Déclenchement
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Secrets DOKPLOY_URL, DOKPLOY_API_KEY ou DOKPLOY_COMPOSE_ID absents, aucun déploiement"
            exit 0
          fi
          .github/scripts/trigger-deploy.sh
      # Sonde du site, si son adresse est renseignée (variable du dépôt) : elle prouve que le site
      # répond, pas que la nouvelle version a remplacé l'ancienne.
      - name: Sonde du site
        if: vars.DEPLOY_HEALTH_URL != ''
        env:
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --retry 18 --retry-delay 10 --retry-all-errors "$DEPLOY_HEALTH_URL" -o /dev/null
